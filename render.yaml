# Render Blueprint — JLS Photography (node:sqlite).
# Create a Blueprint instance from this repo on render.com — free tier.
#
# Required before importing (set in Render dashboard env):
#   JWT_SECRET   long random string (signing key, REQUIRED)
#   ADMIN_PASSWORD  use a strong unique value
#   SITE_URL     https://<your-subdomain>.onrender.com
#
# NOTE: Free tier has no persistent disk — DB + uploads reset on restart.
# Admin password and content will re-seed automatically.

services:
  - type: web
    name: jls-photography
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        sync: false
      - key: SITE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: jls
      - key: ADMIN_PASSWORD
        sync: false
