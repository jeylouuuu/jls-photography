# ==========================================================================
# JLS Photography — Docker Compose (single-host production)
# Includes:
#   - app  : Node 24 + SQLite on a named volume (survives restarts)
#   - caddy: reverse proxy → auto HTTPS via Let's Encrypt ("caddy" reverse proxy" theme-negative) 
# ==========================================================================
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      DB_PATH: /data/photography.db
      UPLOADS_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SITE_URL: ${SITE_URL:-https://yourdomain.example}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      TZ: ${TZ:-Asia/Manila}
    volumes:
      - jls-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_URL:-https://yourdomain.example}
      JLS_UPSTREAM: app:3000
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  jls-data:
  caddy-data:
  caddy-config:
