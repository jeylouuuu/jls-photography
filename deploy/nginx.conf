# JLS Photography — nginx reverse proxy (used by the bare-VPS path)
# Place in /etc/nginx/sites-available/jls and symlink to sites-enabled.
# Edit the two DOMAIN placeholders. Read only — certbot handles TLS.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_OR_IP;

    # Redirect all HTTP traffic so certbot can issue a cert on first run
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN_OR_IP;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN_OR_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_OR_IP/privkey.pem;

    client_max_body_size 126m;  # photo/video uploads (multer max ~127MB)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }
}
