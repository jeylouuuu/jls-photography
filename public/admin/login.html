<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — JLS Admin</title>
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div class="login-page">
    <div class="login-side" style="background-image:url('/uploads/1.jpg')">
      <div class="inner">
        <h2>Behind every frame,<br>a story.</h2>
        <p>Welcome back. Sign in to manage your portfolio, reviews, messages and services.</p>
      </div>
    </div>
    <div class="login-main">
      <div class="login-card">
        <div class="login-brand">
          <span class="mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9.2"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/><path d="M12 2.8v6M12 15.2v6M2.8 12h6M15.2 12h6M5.5 5.5l4.2 4.2M14.3 14.3l4.2 4.2M18.5 5.5l-4.2 4.2M9.7 14.3l-4.2 4.2"/></svg>
          </span>
          <span><b>JLS Photography</b><small>Admin Panel</small></span>
        </div>
        <h1>Sign in</h1>
        <p>Enter your administrator credentials to continue.</p>
        <div class="alert" id="loginAlert"></div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="username">Username or email</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="admin" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
          </div>
          <button class="btn btn--gold btn--block" type="submit" id="loginBtn">
            <span>Sign in</span>
          </button>
        </form>
        <div class="row mt">
          <a href="/" class="dim" style="font-size:13px">← Back to website</a>
        </div>
      </div>
    </div>
  </div>
  <script src="/admin/js/login.js"></script>
</body>
</html>
